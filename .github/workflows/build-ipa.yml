name: Build iOS IPA Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build OffScreen App
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project OffScreen.xcodeproj \
            -scheme OffScreen \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log

      - name: Report Build Diagnostics on Failure
        if: failure()
        run: |
          echo "## ❌ Xcode Build Error Details" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E -C 3 "error:|fatal error:|BUILD FAILED" xcodebuild.log | head -n 80 >> $GITHUB_STEP_SUMMARY || tail -n 80 xcodebuild.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Package into IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Searching all build outputs..."
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r OffScreen.ipa Payload
          ls -lh OffScreen.ipa

      - name: Upload IPA Installer
        uses: actions/upload-artifact@v4
        with:
          name: OffScreen-iOS-Installer
          path: OffScreen.ipa
          retention-days: 14
