name: Build iOS IPA Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build OffScreen App
        run: |
          xcodebuild clean build \
            -project OffScreen.xcodeproj \
            -scheme OffScreen \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r OffScreen.ipa Payload
          echo "IPA created successfully: $(ls -lh OffScreen.ipa)"

      - name: Upload IPA Installer
        uses: actions/upload-artifact@v4
        with:
          name: OffScreen-iOS-Installer
          path: OffScreen.ipa
          retention-days: 14
